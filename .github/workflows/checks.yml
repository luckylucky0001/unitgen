name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.18.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: sh -n bin/unitgen scripts/install-trae.sh scripts/unitgen-env.example.sh
        if: runner.os != 'Windows'
      # Windows: the .cmd launcher starts the CLI; doctor in an empty directory exits 1 with a clear message.
      - run: |
          bin\unitgen.cmd --help
          mkdir empty-project
          bin\unitgen.cmd doctor -C empty-project
          if ($LASTEXITCODE -ne 1) { exit 1 } else { exit 0 }
        if: runner.os == 'Windows'
        shell: pwsh
